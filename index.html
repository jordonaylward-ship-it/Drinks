<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Drink Limit">
<meta name="theme-color" content="#F5F7FB">
<title>Drink Limit</title>
<style>
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  :root{
    --bg:#F5F7FB; --card:#FFFFFF; --text:#1C1C1E; --muted:#6B7280; --line:#E8EAF1; --tab:rgba(255,255,255,.85);
    --sky:#DCEBFF; --sky-ink:#2A62E8;
    --mint:#D7F3E6; --mint-ink:#12714A;
    --peach:#FFE4D3; --peach-ink:#B9521A;
    --rose:#FFDBE4; --rose-ink:#BE2A54;
    --lilac:#E7E0FF; --lilac-ink:#5A3FD1;
    --shadow:0 1px 2px rgba(20,24,40,.05);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    color-scheme:light dark;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0E0F13; --card:#1A1B21; --text:#F2F2F7; --muted:#9A9CA6; --line:#2A2B33; --tab:rgba(26,27,33,.85);
      --sky:#1C2A47; --sky-ink:#8FB4FF;
      --mint:#14301F; --mint-ink:#6FD9A6;
      --peach:#3A2416; --peach-ink:#FFB088;
      --rose:#3A1A24; --rose-ink:#FF8FAD;
      --lilac:#241E44; --lilac-ink:#BBA9FF;
      --shadow:none;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E0F13; --card:#1A1B21; --text:#F2F2F7; --muted:#9A9CA6; --line:#2A2B33; --tab:rgba(26,27,33,.85);
    --sky:#1C2A47; --sky-ink:#8FB4FF;
    --mint:#14301F; --mint-ink:#6FD9A6;
    --peach:#3A2416; --peach-ink:#FFB088;
    --rose:#3A1A24; --rose-ink:#FF8FAD;
    --lilac:#241E44; --lilac-ink:#BBA9FF;
    --shadow:none;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.35; -webkit-font-smoothing:antialiased;
    padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));
    overflow-x:hidden;
  }
  .app{max-width:480px;margin:0 auto;padding:10px 16px 20px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 4px 14px}
  .brand{font-size:28px;font-weight:700;letter-spacing:-.5px;border:0;background:none;color:inherit;font-family:inherit;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .who{display:flex;align-items:center;gap:6px;border:0;background:var(--card);color:var(--muted);font:inherit;font-size:14px;font-weight:500;padding:7px 10px 7px 12px;border-radius:999px;cursor:pointer;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
  .who svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .who.on{color:var(--sky-ink)}

  .card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
  .card h2{margin:0 0 10px;font-size:15px;font-weight:600;color:var(--muted)}
  .card p{margin:0}
  .card ul{margin:0;padding-left:18px}
  .card li{margin:6px 0}
  .cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .cardhead h2{margin:0;min-width:0}

  .hero{position:relative;border-radius:22px;padding:22px 18px 18px;margin-bottom:12px;transition:background .25s}
  .hero.mint{background:var(--mint);color:var(--mint-ink)}
  .hero.sky{background:var(--sky);color:var(--sky-ink)}
  .hero.peach{background:var(--peach);color:var(--peach-ink)}
  .hero.rose{background:var(--rose);color:var(--rose-ink)}
  .hero.lilac{background:var(--lilac);color:var(--lilac-ink)}
  .hero .eyebrow{font-size:15px;font-weight:600;opacity:.85}
  .hero .big{font-size:clamp(40px,16vw,62px);font-weight:700;letter-spacing:-2px;line-height:1.05;font-variant-numeric:tabular-nums;margin:4px 0 6px;white-space:nowrap}
  .hero .big.text{font-size:44px;letter-spacing:-1px}
  .hero .sub{font-size:15px;opacity:.92}
  .hero .sub2{font-size:14px;margin-top:10px;opacity:.92}
  .hero .row{display:flex;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(0,0,0,.08)}
  .hero .stat{flex:1;min-width:0}
  .hero .stat .k{font-size:12px;opacity:.75}
  .hero .stat .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hero .mood{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .hero .mood span{font-size:46px;line-height:1}
  .hero .mood small{font-size:11px;font-weight:600;opacity:.75}
  .hero.withmood .eyebrow,.hero.withmood .sub{padding-right:64px}
  .hero.center .eyebrow,.hero.center .sub{text-align:center}
  .hero.center .stat{text-align:center}
  .hero .emoji{font-size:118px;line-height:1.08;text-align:center;margin:8px 0 6px}
  .bar{height:10px;border-radius:999px;background:rgba(0,0,0,.08);overflow:hidden;margin-top:14px}
  .bar i{display:block;height:100%;border-radius:999px;background:currentColor;opacity:.55;width:0;transition:width .3s}

  .banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--lilac);color:var(--lilac-ink);border-radius:18px;padding:12px 12px 12px 16px;margin-bottom:12px;font-size:15px;font-weight:500}
  .banner .pill{background:var(--card);color:var(--lilac-ink)}

  .seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
  .seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 0;font:inherit;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
  .seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .seg.emo button{font-size:28px;line-height:1.15;padding:6px 0}

  .pill{border:0;background:var(--bg);color:var(--text);font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;flex-shrink:0}
  .pill.on{background:var(--sky);color:var(--sky-ink)}

  .search{position:relative;margin:12px 0 10px}
  .search svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;pointer-events:none}
  .search input{font:inherit;font-size:16px;width:100%;border:0;background:var(--bg);color:var(--text);border-radius:12px;padding:12px 44px 12px 38px;-webkit-appearance:none;appearance:none}
  .search input::-webkit-search-cancel-button{display:none;-webkit-appearance:none}
  .search .clear{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:50%;background:var(--line);color:var(--muted);font-size:17px;line-height:1;cursor:pointer}
  .chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:0;background:var(--bg);color:var(--muted);font:inherit;font-size:14px;font-weight:500;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--text);color:var(--card)}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .wide{grid-column:1/-1}
  .drink{border:0;background:var(--bg);border-radius:14px;padding:12px;text-align:left;font:inherit;color:var(--text);display:flex;flex-direction:column;gap:2px;cursor:pointer;transition:transform .08s;min-width:0}
  .drink:active{transform:scale(.97)}
  .drink .n{font-size:16px;font-weight:600;overflow-wrap:anywhere}
  .drink .s{font-size:13px;color:var(--muted)}
  .drink .m{font-size:12px;color:var(--muted);opacity:.85}
  .drink.custom{background:var(--lilac);color:var(--lilac-ink)}
  .drink.custom .s{color:inherit;opacity:.8}
  .drink.water{background:var(--sky);color:var(--sky-ink)}
  .drink.water .s{color:inherit;opacity:.8}
  .drink.food{background:var(--mint);color:var(--mint-ink)}
  .drink.food .s{color:inherit;opacity:.8}

  .inline{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .inline input{font:inherit;font-size:16px;border:0;background:var(--bg);border-radius:12px;padding:12px 14px;color:var(--text);width:100%}
  .inline .pair{display:flex;gap:10px}
  .inline .pair .btn{flex:1}

  .log .item{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
  .log .item:first-child{border-top:0}
  .log .t{color:var(--muted);font-size:14px;width:66px;font-variant-numeric:tabular-nums;flex-shrink:0}
  .log .nm{flex:1;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .log .sd{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
  .log .x{border:0;background:var(--bg);color:var(--muted);width:30px;height:30px;border-radius:50%;font-size:17px;line-height:1;cursor:pointer;flex-shrink:0}

  .field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .field.first{border-top:0;padding-top:4px}
  .field label,.field .k{font-size:16px}
  .field .v{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
  .field .v.strong{color:var(--text);font-weight:600}
  .field input{font:inherit;font-size:16px;width:150px;text-align:right;border:0;background:var(--bg);border-radius:10px;padding:9px 12px;color:var(--text)}
  .field .unit{display:flex;align-items:center;gap:8px;color:var(--muted)}
  .field .unit input{width:90px}
  .ex{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px;color:var(--muted);border-top:1px solid var(--line)}
  .ex:first-of-type{border-top:0}
  .ex b{color:var(--text);font-weight:500}

  .time{display:block;font:inherit;font-size:32px;font-weight:700;letter-spacing:-.5px;text-align:center;border:0;background:var(--bg);color:var(--text);border-radius:14px;padding:10px 12px;width:100%;min-height:64px;-webkit-appearance:none;appearance:none}
  .time::-webkit-date-and-time-value{text-align:center}
  .timerow{display:flex;gap:10px;align-items:stretch}
  .timerow .time{flex:1;min-width:0}
  .timerow .pill{font-size:16px;padding:0 20px;border-radius:14px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--text);font:inherit;text-align:left;padding:12px;border-radius:14px;cursor:pointer}
  .opt + .opt{margin-top:4px}
  .opt .ot{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;min-width:100px}
  .opt .od{flex:1;color:var(--muted);font-size:14px;min-width:0}
  .opt.on{background:var(--sky);color:var(--sky-ink)}
  .opt.on .od{color:inherit;opacity:.85}
  .badge{font-size:12px;font-weight:700;background:var(--mint);color:var(--mint-ink);padding:4px 9px;border-radius:999px;flex-shrink:0}

  .btn{border:0;border-radius:12px;padding:13px 16px;font:inherit;font-size:16px;font-weight:600;background:var(--text);color:var(--card);width:100%;cursor:pointer}
  .btn.ghost{background:var(--bg);color:var(--text)}
  .btn.danger{background:var(--rose);color:var(--rose-ink)}
  .note{color:var(--muted);font-size:14px;margin:10px 0 0}
  .empty{color:var(--muted);font-size:15px;padding:6px 0;margin:0}

  .tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--tab);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 4px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
  .tabbar .inner{display:flex;width:100%;max-width:480px}
  .tabbar button{flex:1;border:0;background:transparent;font:inherit;font-size:11px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer}
  .tabbar button.on{color:var(--sky-ink)}
  .tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--card);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;z-index:20}
  .toast.show{opacity:1}
  .snack{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px;background:var(--text);color:var(--card);padding:7px 7px 7px 16px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);white-space:nowrap;z-index:21}
  .snack.show{opacity:1;pointer-events:auto;transform:translateX(-50%)}
  .snack button{border:0;background:var(--card);color:var(--text);font:inherit;font-size:14px;font-weight:700;padding:8px 16px;border-radius:999px;cursor:pointer}

  button:focus-visible,input:focus-visible{outline:2px solid var(--sky-ink);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.toast,.snack,.hero,.drink,.bar i{transition:none}.drink:active{transform:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="brand" id="brand" aria-label="Drink Limit">Drink Limit</button>
    <button class="who" id="whoBtn" aria-label="Settings"><span id="who"></span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </header>
  <main id="view"></main>
</div>

<nav class="tabbar" aria-label="Sections">
  <div class="inner">
    <button data-tab="track">
      <svg viewBox="0 0 24 24"><path d="M5 4h14l-1.2 11.6A3 3 0 0 1 14.8 18H9.2a3 3 0 0 1-3-2.4L5 4z"/><path d="M12 18v3M8.5 21h7M6 9h12"/></svg>
      Track
    </button>
    <button data-tab="drive">
      <svg viewBox="0 0 24 24"><path d="M4 14l1.6-4.6A2 2 0 0 1 7.5 8h9a2 2 0 0 1 1.9 1.4L20 14"/><rect x="3" y="14" width="18" height="4.5" rx="1.6"/><circle cx="7.5" cy="19.5" r="1.2"/><circle cx="16.5" cy="19.5" r="1.2"/></svg>
      Drive
    </button>
    <button data-tab="tomorrow">
      <svg viewBox="0 0 24 24"><path d="M4 17h16"/><path d="M7.5 17a4.5 4.5 0 0 1 9 0"/><path d="M12 7v2M5.5 10l1.4 1.4M18.5 10l-1.4 1.4M3 14h2M19 14h2"/></svg>
      Tomorrow
    </button>
    <button data-tab="calories">
      <svg viewBox="0 0 24 24"><path d="M12 3.5c.6 2.6 3.8 4.4 3.8 8.3a3.8 3.8 0 0 1-7.6 0c0-1.3.5-2.3 1.2-3.1.2 1.1.8 1.8 1.6 2.2-.3-2.7.1-5 1-7.4z"/><path d="M12 20.5v-2"/></svg>
      Calories
    </button>
    <button data-tab="sleep">
      <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      Sleep
    </button>
  </div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="snack" id="snack" role="status" aria-live="polite"><span id="snackText"></span><button id="snackUndo">Undo</button></div>

<script>
(function(){

  D('Cider pint', 'cider', 2.2, 260, '570ml, 5%', 'apple tap'),
  D('Somersby Apple', 'cider', 1.2, 160, '330ml bottle, 4.5%', 'apple'),
  D('Strongbow Original', 'cider', 1.4, 160, '355ml bottle, 5%', 'apple'),

  D('Bundy Rum and Cola', 'premix', 1.3, 210, '375ml can, 4.6%', 'bundaberg coke'),
  D('Canadian Club and Dry', 'premix', 1.4, 210, '375ml can, 4.8%', 'cc whisky dry ginger'),
  D('Canadian Club Premium', 'premix', 1.8, 240, '375ml can, 6%', 'cc whisky dry ginger strong'),
  D('Double Jack can', 'premix', 2.0, 240, '375ml can, 6.9%', 'jack daniels jd coke cola strong'),
  D('Hard Solo 4.5%', 'premix', 1.3, 100, '375ml can, zero sugar', 'hard rated lemon squash'),

function norm(s){

function presetByName(n){

function load(){

      var s = JSON.parse(raw);
      d.settings = Object.assign(d.settings, s.settings || {});
      var items = Array.isArray(s.items) ? s.items : [];
      if (!items.length) {
        if (Array.isArray(s.drinks)) s.drinks.forEach(function(x){ items.push({ id: x.id, t: x.t, type: 'drink', name: x.name, std: x.std }); });
        if (Array.isArray(s.water)) s.water.forEach(function(w, i){ items.push({ id: 'w' + w + i, t: w, type: 'water', name: 'Water', std: 0 }); });
      }
      items.forEach(function(x){
        if (x.type === 'drink' && (x.cal === undefined || x.cal === null)) {
          var p = presetByName(x.name);
          x.cal = p ? p.cal : Math.round(Number(x.std) * CAL_PER_STD);
        }
        if (x.type !== 'drink') x.cal = 0;
      });
      d.items = items;
      var names = {};
      DRINKS.forEach(function(x){ names[norm(x.name)] = 1; });
      d.mine = (Array.isArray(s.mine) ? s.mine : []).filter(function(m){ return m && m.name && !names[norm(m.name)]; });
      if (s.usage && typeof s.usage === 'object') d.usage = s.usage;
      else items.forEach(function(x){ if (x.type === 'drink') d.usage[x.name] = (d.usage[x.name] || 0) + 1; });

function fedAt(t){
  var items = state.items;
  for (var i = 0; i < items.length; i++) {
    if (items[i].type !== 'food') continue;
    var gap = t - items[i].t;

function bodyNumbers(){
  var s = state.settings;
  return {
    W: clamp(Number(s.weight) || 71, 30, 250),
    H: clamp(Number(s.height) || 175, 120, 230),
    A: clamp(Number(s.age) || 34, 18, 100),
    female: s.sex === 'female'

}
function rFactor(){
  var b = bodyNumbers();
  var tbw = b.female
    ? (-2.097 + 0.1069 * b.H + 0.2466 * b.W)
    : (2.447 - 0.09516 * b.A + 0.1074 * b.H + 0.3362 * b.W);
  return clamp(1.25 * tbw / b.W, 0.5, 0.85);
}
function perDrink(){
  var b = bodyNumbers();
  return (10 / (b.W * 1000 * rFactor())) * 100;
}
function simulate(t){
  var pd = perDrink();
  var ds = drinksList().filter(function(d){ return d.t <= t; }).sort(function(a, b){ return a.t - b.t; });
  if (!ds.length) return { bac: 0, peak: 0, last: null, pending: 0 };
  var info = ds.map(function(d){
    var fed = fedAt(d.t);
    return { t: d.t, dose: pd * Number(d.std) * (fed ? FOOD_MULT : 1), win: fed ? ABS_FED : ABS };
  });
  var last = ds[ds.length - 1].t;
  var end = 0;
  for (var k = 0; k < info.length; k++) end = Math.max(end, info[k].t + info[k].win);
  var stop = Math.min(t, end);
  var step = 60000;
  var bac = 0, peak = 0;
  for (var tm = info[0].t; tm < stop; tm += step) {
    var dt = Math.min(step, stop - tm);
    var add = 0;
    for (var i = 0; i < info.length; i++) {
      var d = info[i];
      var ov = Math.min(tm + dt, d.t + d.win) - Math.max(tm, d.t);
      if (ov > 0) add += d.dose * (ov / d.win);
    }
    bac = Math.max(0, bac - BETA * (dt / 3.6e6)) + add;
    if (bac > peak) peak = bac;
  }
  if (t > stop) bac = Math.max(0, bac - BETA * ((t - stop) / 3.6e6));
  var pending = 0;
  for (var j = 0; j < info.length; j++) {
    var f = (t - info[j].t) / info[j].win;
    if (f < 1) pending += info[j].dose * (1 - Math.max(0, f));
  }
  return { bac: bac, peak: peak, last: last, pending: pending };
}
function total(){ return drinksList().reduce(function(a, d){ return a + Number(d.std); }, 0); }
function totalCal(){ return drinksList().reduce(function(a, d){ return a + (Number(d.cal) || 0); }, 0); }
function hoursUntil(bac, target){ return bac > target ? (bac - target) / BETA : 0; }
function nextDose(now){ return perDrink() * (fedAt(now) ? FOOD_MULT : 1); }

function driveInfo(now){
  var sim = simulate(now);
  var bac = sim.bac + sim.pending;
  var zero = state.settings.licence !== 'open';
  var status, color;
  if (bac <= 0.0005) { status = 'Clear'; color = 'mint'; }
  else if (zero) { status = 'No'; color = 'rose'; }
  else if (bac >= 0.05) { status = 'No'; color = 'rose'; }
  else if (bac >= 0.03) { status = 'Risky'; color = 'peach'; }
  else { status = 'Under 0.05'; color = 'mint'; }
  var hUnder = zero ? bac / BETA : hoursUntil(bac, 0.05);
  var hZero = bac / BETA;
  return { bac: bac, status: status, color: color, zero: zero, hUnder: hUnder, hZero: hZero,
    underAt: new Date(now + hUnder * 3.6e6), zeroAt: new Date(now + hZero * 3.6e6) };
}
function nextDrink(now){
  var g = state.settings.goal;
  if (g === null || g === undefined) return null;
  var sim0 = simulate(now);
  var bac = sim0.bac + sim0.pending;
  var target = g - nextDose(now);
  if (target < 0) return { never: true };
  if (bac <= target + 1e-9) return { ok: true, sec: 0 };
  var h = (bac - target) / BETA;
  return { ok: false, sec: h * 3600, at: new Date(now + h * 3.6e6) };
}
function dehydrated(tot, water){ return tot >= 6 && water < tot / 2; }

  if (tot >= 10 && i < 2) i = 2;

}

/* drinks list */
function catLabel(id){
  for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) return CATS[i].label;
  return '';
}
function allDrinks(){
  var names = {};
  DRINKS.forEach(function(d){ names[norm(d.name)] = 1; });
  var mine = (state.mine || []).filter(function(m){ return m && m.name && !names[norm(m.name)]; }).map(function(m){
    return { name: m.name, cat: 'yours', std: Number(m.std) || 0, cal: Number(m.cal) || 0, note: 'Saved by you', k: '' };
  });
  return DRINKS.concat(mine);
}
function byName(n){
  var all = allDrinks();
  for (var i = 0; i < all.length; i++) if (all[i].name === n) return all[i];
  var nn = norm(n);
  for (var j = 0; j < all.length; j++) if (norm(all[j].name) === nn) return all[j];
  return null;
}
function sortAZ(list){
  return list.slice().sort(function(a, b){ return a.name.localeCompare(b.name, 'en', { sensitivity: 'base', numeric: true }); });
}
function usualDrinks(){
  var all = allDrinks();
  var score = {};
  STARTERS.forEach(function(n, i){ score[n] = 0.001 * (STARTERS.length - i); });
  all.forEach(function(d){ if (d.cat === 'yours') score[d.name] = (score[d.name] || 0) + 0.5; });
  var u = state.usage || {};
  Object.keys(u).forEach(function(n){ score[n] = (score[n] || 0) + (Number(u[n]) || 0); });
  var pool = all.filter(function(d){ return score[d.name] !== undefined; });
  pool.sort(function(a, b){ return score[b.name] - score[a.name]; });
  return sortAZ(pool.slice(0, 14));
}
function drinksIn(c){
  if (c === 'usual') return usualDrinks();
  if (c === 'az') return sortAZ(allDrinks());
  return sortAZ(allDrinks().filter(function(d){ return d.cat === c; }));
}
function searchDrinks(q){
  var nq = norm(q);
  if (!nq) return [];
  var words = nq.split(' ');
  var res = [];
  allDrinks().forEach(function(d){
    var nn = norm(d.name);
    var hay = nn + ' ' + norm(d.k) + ' ' + norm(catLabel(d.cat)) + ' ' + norm(d.note);
    for (var i = 0; i < words.length; i++) if (hay.indexOf(words[i]) < 0) return;
    var r = nn.indexOf(nq) === 0 ? 0 : (' ' + nn).indexOf(' ' + nq) >= 0 ? 1 : nn.indexOf(nq) >= 0 ? 2 : 3;
    res.push({ d: d, r: r });
  });
  res.sort(function(a, b){ return a.r - b.r || a.d.name.localeCompare(b.d.name, 'en', { sensitivity: 'base', numeric: true }); });
  return res.map(function(x){ return x.d; });
}
function drinkTile(d){

    return h;
  }
  var list = drinksIn(cat);
  if (!list.length) h += '<p class="empty wide">None yet. Add one with Something else.</p>';
  h += list.map(drinkTile).join('');
  h += '<button class="drink custom" data-act="custom"><span class="n">Something else</span><span class="s">Add it once, it stays in the list</span></button>';
  if (cat === 'cocktails') h += '<p class="note wide">Bar pours vary, these are typical.</p>';

}
function chipsHtml(){

function logItem(type, name, std, cal){
  var t = Date.now() - offsetMin * 60000;
  state.items.push({ id: t + Math.random().toString(36).slice(2, 7), t: t, type: type, name: name, std: Number(std) || 0, cal: type === 'drink' ? Math.round(Number(cal) || 0) : 0 });
  if (type === 'drink') {
    state.usage[name] = (Number(state.usage[name]) || 0) + 1;
    query = '';
  }
  offsetMin = 0;
  customOpen = false;
  customName = '';
  save();
  render();
  if (type === 'nb') toast('Logged');
  else if (type === 'drink') toast('Logged ' + name + ', ' + fmtStd(std) + ' std, ' + Math.round(cal) + ' cal');
  else toast(name + ' logged');
}

function addCustom(){
  var n = (el('cName').value || '').trim() || 'Drink';
  var sd = Number(el('cStd').value);
  if (!sd || sd <= 0) { el('cStd').focus(); toast('Put in the standard drinks'); return; }
  sd = Math.round(sd * 10) / 10;
  var c = Number(el('cCal').value);
  if (!c || c < 0) c = sd * CAL_PER_STD;
  c = Math.round(c);
  var found = byName(n);
  if (!found && n !== 'Drink') state.mine.push({ name: n, std: sd, cal: c, note: 'yours' });
  logItem('drink', found ? found.name : n, sd, c);
}

function oldNight(){ var t = lastItemT(); return t > 0 && Date.now() - t > OLD_NIGHT_H * 3.6e6; }

  var ago = h < 48 ? Math.round(h) + ' hours ago' : Math.round(h / 24) + ' days ago';
  return 'Last log was ' + ago + '.';
}

/* sleep */
function atTime(v, base){
  var p = String(v || '').split(':');
  var d = new Date(base);
  d.setHours(Number(p[0]) || 0, Number(p[1]) || 0, 0, 0);
  return d;
}
function nextAt(v, now){
  var d = atTime(v, now);
  if (d.getTime() <= now) d.setDate(d.getDate() + 1);
  return d.getTime();
}
function nearAt(v, now){
  var d = atTime(v, now);
  if (d.getTime() < now - 3.6e6) d.setDate(d.getDate() + 1);
  return d.getTime();
}
function sleepPlan(now){
  var s = state.sleep;
  var mode = s.mode === 'bed' ? 'bed' : 'wake';
  var opts = [];
  var W = null, B = null;
  var span = function(c){ return (c * CYCLE_MIN + FALL_ASLEEP_MIN) * 60000; };
  if (mode === 'wake') {
    W = nextAt(s.wake || '06:30', now);
    [6, 5, 4, 3, 2, 1].forEach(function(c){
      var bed = W - span(c);
      if (bed >= now - 60000) opts.push({ c: c, bed: bed, wake: W });
    });
    opts = opts.slice(0, 4).sort(function(a, b){ return a.bed - b.bed; });
  } else {
    B = s.bed ? nearAt(s.bed, now) : now;
    [3, 4, 5, 6].forEach(function(c){ opts.push({ c: c, bed: B, wake: B + span(c) }); });
  }
  var rec = null, sel = null;
  opts.forEach(function(o){ if (o.c === 5) rec = o; });
  if (!rec && opts.length) rec = opts.reduce(function(a, o){ return o.c > a.c ? o : a; });
  opts.forEach(function(o){ if (o.c === Number(s.pick)) sel = o; });
  return { mode: mode, opts: opts, rec: rec, sel: sel || rec, W: W, B: B };
}
function cyclesTxt(c){ return c + ' cycle' + (c === 1 ? '' : 's') + ', ' + fmtHrs(c * 1.5) + ' sleep'; }
function optRow(o, plan){
  var main = plan.mode === 'wake' ? o.bed : o.wake;
  return '<button class="opt' + (o === plan.sel ? ' on' : '') + '" data-spick="' + o.c + '">' +
    '<span class="ot">' + fmtTime(new Date(main)) + '</span>' +
    '<span class="od">' + o.c + ' cycle' + (o.c === 1 ? '' : 's') + ', ' + fmtHrs(o.c * 1.5) + '</span>' +
    (o === plan.rec ? '<span class="badge">Best</span>' : '') + '</button>';
}

      set('heroEyebrow', 'Estimated BAC');
      set('heroBig', fmtBac(eff));
      set('heroSub', nDrinks ? 'No cap. Your head’s gonna hurt and it’s a full day write off.' : 'No cap set. Pick one in Tomorrow if you want pacing.');
    } else if (nd.never) {
      setHero('hero', 'rose');
      set('heroEyebrow', 'Heads up');
      set('heroBig', '0');
      set('heroSub', 'One standard drink alone puts you over ' + fmtGoal(g) + ' at your size.');
    } else if (nd.ok) {
      setHero('hero', 'mint');
      set('heroEyebrow', 'Next drink');
      set('heroBig', 'Now');
      set('heroSub', nDrinks ? 'You can have one and stay under ' + fmtGoal(g) + '.' : 'Ready when you are. Your cap is ' + fmtGoal(g) + '.');
    } else {
      setHero('hero', 'peach');
      set('heroEyebrow', 'Next drink in');
      set('heroBig', fmtCountdown(nd.sec));
      set('heroSub', 'Keeps your peak under ' + fmtGoal(g) + '. That is about ' + fmtTime(nd.at) + '.');
    }
    var bigEl = el('heroBig');
    if (bigEl) bigEl.classList.toggle('text', nd !== null && !nd.never && nd.ok);
    set('heroMood', mood.emoji);
    var hm = el('heroMood'); if (hm) hm.setAttribute('aria-label', 'Tomorrow: ' + mood.label);
    set('heroBac', fmtBac(eff));
    set('heroTotal', fmtStd(tot) + ' std');
    set('heroDrive', di.status);
    set('waterCount', water + ' today');
    set('foodCount', foodCount() ? foodCount() + ' today' + (fedAt(now) ? ', working now' : '') : 'a proper meal');
    set('logHead', nDrinks ? 'Today, ' + fmtStd(tot) + ' std, ' + fmtNum(cal) + ' cal' : 'Today');
  }

  if (tab === 'drive') {
    var d = driveInfo(now);
    setHero('driveHero', d.color);
    set('driveStatus', d.status);
    var limitTxt = d.zero ? 'Your limit is zero.' : 'Your limit is under 0.05.';
    if (d.status === 'Clear') {
      set('driveSub', nDrinks ? 'Estimate is back to zero. ' + limitTxt : 'Nothing logged. ' + limitTxt);
    } else {
      set('driveSub', 'Estimated BAC ' + fmtBac(d.bac) + '. ' + limitTxt);
    }
    if (!d.zero) set('driveUnder', d.hUnder <= 0 ? 'Now' : 'About ' + fmtWhen(d.underAt) + ', in ' + fmtDur(d.hUnder));
    set('driveZero', d.hZero <= 0 ? 'Now' : 'About ' + fmtWhen(d.zeroAt) + ', in ' + fmtDur(d.hZero));
  }

  if (tab === 'tomorrow') {
    var dry = dehydrated(tot, water);
    setHero('hgHero', mood.color);
    set('hgEmoji', mood.emoji);
    var he = el('hgEmoji'); if (he) he.setAttribute('aria-label', mood.label);
    set('hgText', nDrinks ? mood.text + (dry ? ' You are behind on water.' : '') : 'Nothing logged yet.');
    set('hgPeak', fmtBac(peak));
    set('hgTotal', fmtStd(tot) + ' std');
    var need = Math.ceil(tot);
    set('hgWater', water + ' of ' + need);
    var nd2 = nextDrink(now);
    if (nd2 === null) set('hgNext', 'No cap');
    else if (nd2.never) set('hgNext', 'Not under this cap');
    else if (nd2.ok) set('hgNext', 'Now');
    else set('hgNext', fmtCountdown(nd2.sec) + ', about ' + fmtTime(nd2.at));
    var projPeak = Math.max(peak, eff + dose);
    var projTier = TIERS[tierIndex(projPeak, tot + 1, water)];
    set('hgOneMore', 'Peak ' + fmtBac(projPeak) + '  ' + projTier.emoji);
    if (g === null || g === undefined) set('hgGoalNote', 'No cap, so no timer. Your head’s gonna hurt and it’s a full day write off.');
    else set('hgGoalNote', 'The timer keeps you at ' + TIERS[goalIndex()].emoji + ' or better. Under 0.05 most people wake up fine. Over 0.08 a hangover is likely. Over 0.11 it is near certain.');
    set('hgWaterTip', 'Water. One glass per drink. You are at ' + water + ' of ' + need + '. It does not lower your BAC, it stops the dehydration part.');
    set('hgFoodTip', fedAt(now) ? 'Food. You have eaten recently, so drinks are hitting slower right now. Eat again in a few hours.' : 'Food. A proper meal makes the next two hours of drinks hit slower and softer.');
  }

  if (tab === 'calories') {
    var lim = Number(state.settings.calLimit) || 0;
    var left = lim - cal;
    var frac = lim > 0 ? cal / lim : 0;
    setHero('calHero', frac >= 1 ? 'rose' : frac >= 0.7 ? 'peach' : 'mint');
    set('calBig', fmtNum(cal));
    if (!lim) set('calSub', 'No limit set. Put one in Settings.');
    else if (left >= 0) set('calSub', 'of ' + fmtNum(lim) + ' for the night. ' + fmtNum(left) + ' left.');
    else set('calSub', 'Over your ' + fmtNum(lim) + ' by ' + fmtNum(-left) + '.');
    var bar = el('calBar');
    if (bar) bar.style.width = Math.min(100, Math.round(frac * 100)) + '%';
    set('calLimit', lim ? fmtNum(lim) : 'none');
    set('calLeft', lim ? fmtNum(Math.max(0, left)) : '');
    set('calMac', (cal / BIG_MAC).toFixed(1));
  }

  if (tab === 'sleep') {
    var plan = sleepPlan(now);
    var sel = plan.sel;
    if (plan.mode === 'wake') {
      set('slListHead', 'Bedtimes for a ' + fmtTime(new Date(plan.W)) + ' wake up');
      if (!sel) {
        setHero('slHero', 'rose');
        set('slEyebrow', 'Up at ' + fmtTime(new Date(plan.W)));
        set('slBig', 'Too late');
        set('slSub', 'Less than one full cycle left before you need to be up.');
      } else {
        setHero('slHero', sel.c >= 5 ? 'sky' : sel.c >= 4 ? 'lilac' : 'peach');
        set('slEyebrow', 'Lights out at');
        set('slBig', fmtTime(new Date(sel.bed)));
        var inMs = sel.bed - now;
        set('slSub', cyclesTxt(sel.c) + '. ' + (inMs > 60000 ? 'That’s in ' + fmtDur(inMs / 3.6e6) + '.' : 'That’s now.'));
      }
    } else {
      set('slListHead', 'Wake up times');
      setHero('slHero', sel.c >= 5 ? 'sky' : sel.c >= 4 ? 'lilac' : 'peach');
      set('slEyebrow', 'Set your alarm for');
      set('slBig', fmtTime(new Date(sel.wake)));
      set('slSub', cyclesTxt(sel.c) + (state.sleep.bed ? ', in bed at ' + fmtTime(new Date(plan.B)) + '.' : ', if you hit the pillow now.'));
      if (!state.sleep.bed) {
        var ti = el('slTime');
        if (ti && document.activeElement !== ti) { var hv = hhmm(new Date(now)); if (ti.value !== hv) ti.value = hv; }
      }
    }
    var lh = plan.opts.map(function(o){ return optRow(o, plan); }).join('') || '<div class="empty">No full cycles fit before then.</div>';
    var list = el('slList');
    if (list && list.getAttribute('data-h') !== lh) { list.innerHTML = lh; list.setAttribute('data-h', lh); }
    var alc = '';
    if (sel && nDrinks) {
      var sb = simulate(sel.bed);
      var bb = sb.bac + sb.pending;
      if (bb > 0.005) alc = 'You’ll still be about ' + fmtBac(bb) + ' at bedtime. Alcohol breaks up your sleep cycles, so expect lighter sleep.';
      else if (sel.bed - lastDrinkT() < 4 * 3.6e6) alc = 'Last drink is within 4 hours of bed. That still breaks up your sleep cycles.';
    }
    set('slAlc', alc);
    var ae = el('slAlc'); if (ae) ae.hidden = !alc;
  }

  if (tab === 'nb') {
    var nl = nbList();
    var day = nbSince(24 * 3.6e6);
    var lastT = nl.reduce(function(a, x){ return Math.max(a, x.t); }, 0);
    var st = nbStage(day);
    setHero('nbHero', st.color);
    set('nbStage', st.label);
    set('nbSub', st.sub);
    set('nbBig', String(day));
    set('nbLast', lastT ? fmtCountdown((now - lastT) / 1000) + ' ago' : 'none');
    set('nbDay', String(day));
    set('nbDrive', nbRecent() ? 'No' : 'Clear');
  }

  if (tab === 'settings') {
    set('howText', 'One standard drink is 10g of alcohol. At your age, height, weight and sex each one lifts your BAC by about ' + fmtBac(perDrink()) + ' and soaks in over about 30 minutes. Log it when you start it. A proper meal makes the next two hours of drinks soak in slower and takes about a fifth off what reaches your blood. Water changes nothing on the BAC side, it only helps tomorrow. Your body clears about 0.015 an hour. Calories are the alcohol at 7 a gram plus the mixer. Only a breath test knows your real number.');
  }
}

var view = el('view');
view.addEventListener('click', onClick);
view.addEventListener('input', onInput);
view.addEventListener('change', function(e){ if (e.target.id === 'slTime') setSleepTime(e.target.value); });
view.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && e.target.id === 'drinkSearch') { e.preventDefault(); e.target.blur(); }
});
Array.prototype.forEach.call(document.querySelectorAll('.tabbar button'), function(b){
  b.addEventListener('click', function(){ go(b.getAttribute('data-tab')); });
});
el('whoBtn').addEventListener('click', function(){ go(tab === 'settings' ? 'track' : 'settings'); });
el('brand').addEventListener('click', function(){ go(tab === 'nb' ? 'track' : 'nb'); });
el('snackUndo').addEventListener('click', undoNewNight);

render();
setInterval(tick, 1000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) tick(); });
})();
</script>
</body>
</html>
